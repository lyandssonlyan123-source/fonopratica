    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    iconRef.current.setAttribute('data-lucide', kebabName);
                    window.lucide.createIcons();
                }
            }, [name, size]);
            return <i ref={iconRef} style={{ width: size, height: size }} className={`lucide-icon ${className}`}></i>;
        };

        const Reveal = ({ children, className = "", delay = 0, type = "up" }) => {
            const ref = useRef(null);
            const [isActive, setIsActive] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => setIsActive(true), delay);
                    }
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [delay]);

            const animationClass = type === 'up' ? 'reveal-up' : type === 'left' ? 'reveal-left' : 'reveal-right';

            return (
                <div ref={ref} className={`reveal ${animationClass} ${isActive ? 'active' : ''} ${className}`}>
                    {children}
                </div>
            );
        };
