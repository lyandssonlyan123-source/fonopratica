        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .text-gold-shine {
            background: linear-gradient(to bottom, #F4E3C1 0%, #C5A059 50%, #8A6D3B 100%);

            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));

            position: relative;

            transition: all 0.3s ease;

            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(30deg);

        }
        @keyframes shinySweep {

            100% { left: 120%; }

            width: 150%;
            height: 150%;

            animation: rotateGold 4s linear infinite;
        }
        @keyframes rotateGold {
            from { transform: rotate(0deg); }

            top: 50%;
            right: -50%;

            height: 2px;

                    window.lucide.createIcons();

            return <i ref={iconRef} style={{ width: size, height: size }} className={`lucide-icon ${className}`}></i>;

                                    { q: "Os arquivos são editáveis?", a: "Os arquivos são entregues em formato PDF de alta qualidade, prontos para impressão ou uso digital em tablets, garantindo a fidelidade do design luxuoso." },
                                    { q: "Consigo aplicar em qualquer idade?", a: "O acervo cobre desde a estimulação precoce até o refinamento de escrita e cognição, sendo ideal para pacientes de 2 a 12 anos." }
                                ].map((faq, i) => (
                                    <div key={i} className="bg-white rounded-[2.5rem] overflow-hidden shadow-sm transition-all hover:shadow-md">
                                        <button onClick={() => setActiveFAQ(activeFAQ === i ? null : i)} className="w-full p-10 text-left flex justify-between items-center font-black uppercase italic tracking-tight text-sm">
                                            {faq.q}
                                            <Icon name="ChevronDown" className={`text-gold transition-transform duration-500 ${activeFAQ === i ? 'rotate-180' : '0'}`} size={24} />
                                        </button>
                                        {activeFAQ === i && <div className="p-10 pt-0 text-gray-400 italic font-medium border-t border-slate-50 mt-2">{faq.a}</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className="bg-deep py-24 px-4 text-center border-t border-white/5">
                        <div className="max-w-4xl mx-auto space-y-12">
                            <h3 className="text-white font-black text-6xl uppercase tracking-[0.5em] opacity-5 italic">FonoPrática</h3>
                            <div className="flex justify-center gap-10 text-gray-600 text-[10px] font-black uppercase tracking-widest italic">
                                <span>Privacidade</span>
                                <span>Termos de Uso</span>
                                <span>Suporte Técnico</span>
                            </div>
                            <p className="text-[10px] uppercase font-black text-white/10 tracking-[0.3em] italic">© 2024 Arsenal Terapêutico FonoPrática - O Padrão Ouro da Fonoaudiologia Clínica</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
