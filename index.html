<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FonoPrática | O Arsenal Definitivo da Fonoaudiologia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#F4E3C1', DEFAULT: '#C5A059', dark: '#A38448' },
                        health: { light: '#F8FAFC', DEFAULT: '#F1F5F9', dark: '#64748B' }
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .bg-gold-gradient { background: linear-gradient(135deg, #C5A059 0%, #E8D4A2 50%, #C5A059 100%); }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 1s ease-out forwards; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }

</head>
<body class="bg-white text-gray-900">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Zap, CheckCircle2, Star, Clock, ShieldCheck, 
          ChevronDown, ShoppingBag, Award, MessageCircle, 
          Brain, Volume2, Smile, Lock, Timer, Heart,
          CreditCard, Mail, Download, MousePointerClick,
          Users, BookOpen, Gift, Rocket, Printer, FileText,
          AlertCircle, ChevronRight, XCircle, Sparkles,
          Search, ShieldAlert, BadgeCheck, Quote
        } from 'lucide-react';

        const App = () => {
          const [timeLeft, setTimeLeft] = useState(900);
          const [activeFAQ, setActiveFAQ] = useState(null);
          const [showToast, setShowToast] = useState(false);
          const [toastData, setToastData] = useState({ name: '', city: '' });
          const [heroIndex, setHeroIndex] = useState(0);

          const images = [
            "https://i.ibb.co/JFSBJBVd/Chat-GPT-Image-8-de-jan-de-2026-19-17-52.png",
            "https://i.ibb.co/SwHK8ZTV/Chat-GPT-Image-8-de-jan-de-2026-22-24-43.png",
            "https://i.ibb.co/gFcLj4QJ/Chat-GPT-Image-8-de-jan-de-2026-22-31-49.png"
          ];

          useEffect(() => {
            const timer = setInterval(() => setTimeLeft((prev) => (prev > 0 ? prev - 1 : 0)), 1000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            const slideInterval = setInterval(() => setHeroIndex((prev) => (prev === images.length - 1 ? 0 : prev + 1)), 4500);
            return () => clearInterval(slideInterval);
          }, [images.length]);

          useEffect(() => {
            const names = ["Ana", "Beatriz", "Carla", "Juliana", "Paula", "Renata", "Mariana", "Cristina"];
            const toastInterval = setInterval(() => {
              setToastData({ name: names[Math.floor(Math.random() * names.length)] });
              setShowToast(true);
              setTimeout(() => setShowToast(false), 5000);
            }, 22000);
            return () => clearInterval(toastInterval);
          }, []);

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          return (
            <div className="min-h-screen bg-white font-poppins text-gray-900 overflow-x-hidden">
              {/* Toast */}
              <div className={`fixed top-24 right-4 z-[100] transition-all duration-700 transform ${showToast ? 'translate-x-0 opacity-100' : 'translate-x-full opacity-0'}`}>
                <div className="bg-white/95 backdrop-blur-md border border-gold/20 shadow-2xl rounded-2xl p-4 flex items-center gap-3 w-80">
                  <div className="bg-gold/10 p-2.5 rounded-xl text-gold-dark"><ShoppingBag size={22} /></div>

                </div>
              </header>

              {/* Depoimentos */}

                  <div className="text-center space-y-6">

                        <p className="text-gray-600 font-medium italic mb-8 leading-relaxed">"{test.comment}"</p>
                        <div><h4 className="font-black text-gray-900 uppercase text-sm tracking-tighter">{test.name}</h4><p className="text-gold font-bold text-[10px] uppercase tracking-widest">{test.role}</p></div>

                <div className="max-w-6xl mx-auto space-y-24 text-center lg:text-left">
                    <h2 className="text-4xl md:text-6xl font-black uppercase tracking-tighter italic text-center">Profissionalismo vs <span className="text-gold">Amadorismo.</span></h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="bg-white p-12 rounded-[4rem] border-l-8 border-red-500 space-y-8 shadow-sm">
                            <h3 className="text-2xl font-black uppercase text-red-600 flex items-center gap-3 justify-center lg:justify-start"><XCircle /> O Jeito Antigo</h3>

              {/* Jornada de Entrega */}

                <div className="max-w-6xl mx-auto text-center">

                      { title: "Aprovação Imediata", desc: "PIX ou Cartão liberam o conteúdo em menos de 2 minutos.", icon: <CreditCard size={40} />, step: "02", side: "right" },

                    ].map((item, i) => (
                      <div key={i} className={`flex flex-col lg:flex-row items-center gap-16 relative ${item.side === 'right' ? 'lg:flex-row-reverse' : ''}`}>

                        <div className="flex-shrink-0 w-32 h-32 bg-white rounded-full border-8 border-health-light flex items-center justify-center shadow-2xl relative z-10 text-gold">{item.icon}</div>
                        <div className="flex-1 hidden lg:block"></div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Kit */}
              <section className="py-40 px-4 bg-health-light border-y border-gray-100 overflow-hidden">
                <div className="max-w-6xl mx-auto flex flex-col lg:flex-row items-center gap-24">
                    <div className="flex-1 space-y-10">
                        <h2 className="text-4xl md:text-7xl font-black uppercase tracking-tighter italic leading-none text-center lg:text-left">O que vem no <span className="text-gold">Kit?</span></h2>
                        <div className="grid grid-cols-1 gap-6">
                            {["Consciência Fonológica", "Treino Articulatório Completo", "Estimulação de Linguagem", "Motricidade Orofacial", "Templates de Relatórios"].map((item, i) => (
                                <div key={i} className="flex items-center gap-4 bg-white p-6 rounded-3xl border border-gray-100 shadow-sm"><CheckCircle2 className="text-gold" /><span className="font-black uppercase tracking-tight text-sm italic">{item}</span></div>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1"><div className="relative p-2 bg-white rounded-[4rem] shadow-2xl border border-gray-100"><img src={images[1]} className="w-full h-full object-cover rounded-[3.5rem]" alt="Conteúdo" /></div></div>
                </div>
              </section>

              {/* Bônus Único */}
              <section className="py-40 px-4 bg-gray-950 text-white overflow-hidden relative">
                <div className="max-w-6xl mx-auto relative z-10">
                    <div className="bg-gold/10 border border-gold/20 rounded-[4rem] p-12 md:p-24 flex flex-col lg:flex-row items-center gap-20">
                        <div className="flex-1 space-y-8 text-center lg:text-left">
                            <div className="inline-flex items-center gap-2 bg-gold text-black px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">Presente Exclusivo</div>
                            <h2 className="text-4xl md:text-7xl font-black uppercase tracking-tighter italic">Guia de <span className="text-gold">Trava-línguas</span></h2>

                            <div className="flex flex-col gap-4">
                                <div className="text-gray-500 line-through font-bold text-2xl uppercase italic opacity-50">Valor: R$ 47,00</div>
                                <div className="text-gold font-black text-4xl uppercase italic animate-pulse">Hoje: Grátis</div>
                            </div>
                        </div>
                        <div className="flex-1 w-full max-w-md">
                            <div className="bg-white p-4 rounded-[3rem] shadow-2xl border-2 border-gold/30 overflow-hidden"><img src={images[2]} className="rounded-[2.5rem] w-full" /><div className="mt-6 pt-4 text-center"><span className="text-gray-900 font-black text-[10px] uppercase italic tracking-widest">Apoio Articulatório Profissional</span></div></div>
                        </div>
                    </div>
                </div>
              </section>

              {/* Garantia */}
              <section className="py-40 px-4 bg-white">
                <div className="max-w-4xl mx-auto bg-health-light rounded-[4rem] p-16 flex flex-col md:flex-row items-center gap-16 border border-gray-100 shadow-inner">
                    <div className="w-48 h-48 flex-shrink-0 bg-white rounded-full flex items-center justify-center border-8 border-gold/10 shadow-2xl"><ShieldCheck size={100} className="text-gold" /></div>
                    <div className="space-y-6 text-center md:text-left"><h2 className="text-3xl font-black text-gray-900 uppercase italic">Garantia Blindada <span className="text-gold">7 Dias</span></h2><p className="text-gray-500 font-medium text-lg italic">Se não ficar impressionada com a qualidade, devolvemos 100% do seu investimento.</p></div>
                </div>
              </section>

              {/* Oferta Final */}
              <section id="oferta" className="py-40 px-4 bg-white relative">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-gray-900 rounded-[5rem] p-16 md:p-24 text-center text-white relative shadow-2xl border-b-[16px] border-gold overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-gold/10 blur-[80px] -translate-y-1/2 translate-x-1/2"></div>
                    <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-gold-gradient text-white px-12 py-5 rounded-full font-black uppercase text-sm tracking-[0.3em] shadow-2xl italic">OFERTA POR TEMPO LIMITADO</div>
                    <h2 className="text-4xl md:text-8xl font-black mb-8 italic uppercase leading-none">Arsenal FonoPrática</h2>
                    <p className="text-gray-400 mb-16 font-bold uppercase tracking-[0.4em] text-[10px] italic">E-book Completo + Bônus Dicção + Acesso Vitalício</p>
                    <div className="flex flex-col items-center mb-16">
                        <span className="text-gray-600 line-through text-2xl font-bold italic opacity-40 mb-2 uppercase">R$ 164,00</span>
                        <div className="flex items-center justify-center">
                            <span className="text-4xl md:text-6xl font-black text-gold mr-3 self-center transform -translate-y-6 italic">R$</span>
                            <span className="text-[12rem] md:text-[16rem] font-black text-white leading-none tracking-tighter">24</span>
                            <div className="flex flex-col items-start ml-2 self-start pt-12"><span className="text-7xl md:text-9xl font-black text-white leading-none tracking-tighter border-b-8 border-gold/30">,90</span></div>
                        </div>
                    </div>
                    <a href="https://pay.kiwify.com.br/mPAGzGJ" className="inline-block w-full max-w-xl bg-gold text-white py-10 rounded-full font-black text-3xl uppercase shadow-2xl hover:bg-gold-dark transition-all transform hover:scale-105 active:scale-95 animate-bounce">QUERO MEU ACESSO AGORA</a>
                    <div className="mt-20 flex flex-wrap justify-center gap-14 border-t border-white/5 pt-16 font-black uppercase text-gray-500 text-[11px] tracking-[0.25em]">
                      {[{ l: "Garantia Total", i: <ShieldCheck size={22} /> }, { l: "Envio Instantâneo", i: <Zap size={22} /> }, { l: "Acesso Vitalício", i: <Clock size={22} /> }].map((b, i) => (
                        <div key={i} className="flex items-center gap-4"><span className="text-gold">{b.i}</span> {b.l}</div>
                      ))}
                    </div>
                  </div>
                </div>
              </section>

              {/* FAQ */}
              <section className="py-40 px-4 bg-health-light">
                <div className="max-w-4xl mx-auto space-y-10">
                  <h2 className="text-4xl md:text-6xl font-black uppercase italic text-gray-900 tracking-tighter text-center">Dúvidas <span className="text-gold">Respondidas</span></h2>
                  <div className="space-y-6">
                    {[
                      { q: "O acesso é realmente vitalício?", a: "Sim! Você paga uma única vez e o material é seu para sempre." },
                      { q: "Como o material é entregue?", a: "Imediatamente após a aprovação, você recebe os dados de login no seu e-mail." },

              {/* Footer */}
              <footer className="bg-gray-950 text-gray-700 py-40 px-4 text-center">

</body>
